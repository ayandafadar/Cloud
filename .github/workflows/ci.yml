# Blue-Green Deployment — CI Pipeline
# Runs on every push and pull request to main.
# Builds, tests, and creates Docker images.

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  IMAGE_NAME: deployshift-api

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          TARGET_RELEASE: '1.0.0'

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          TARGET_RELEASE: '1.0.0'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Blue image (v1.0.0)
        run: docker build -t ${{ env.IMAGE_NAME }}:v1.0.0 .

      - name: Build Green image (v2.0.0)
        run: docker build -t ${{ env.IMAGE_NAME }}:v2.0.0 .

      - name: Verify Blue image
        run: |
          docker run -d --name blue-test -e APP_VERSION=1.0.0 -e APP_ENV=blue -p 3001:3000 ${{ env.IMAGE_NAME }}:v1.0.0
          sleep 5
          curl -sf http://localhost:3001/health | jq .
          curl -sf http://localhost:3001/api/version | jq .
          docker stop blue-test
          docker rm blue-test

      - name: Verify Green image
        run: |
          docker run -d --name green-test -e APP_VERSION=2.0.0 -e APP_ENV=green -p 3002:3000 ${{ env.IMAGE_NAME }}:v2.0.0
          sleep 5
          curl -sf http://localhost:3002/health | jq .
          curl -sf http://localhost:3002/api/version | jq .
          docker stop green-test
          docker rm green-test

      - name: List built images
        run: docker images ${{ env.IMAGE_NAME }}

