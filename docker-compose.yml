# Docker Compose for local development and testing
# Runs both Blue (v1) and Green (v2) instances side by side
# Usage: docker compose up

services:
  blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployshift-api-blue
    environment:
      - APP_VERSION=1.0.0
      - APP_ENV=blue
      - PORT=3000
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deployshift-api-green
    environment:
      - APP_VERSION=2.0.0
      - APP_ENV=green
      - PORT=3000
    ports:
      - "3002:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
