# Green Deployment — v2.0.0 of the application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-green-api-green
  namespace: blue-green
  labels:
    app: blue-green-api
    version: green
    project: blue-green-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-api
      version: green
  template:
    metadata:
      labels:
        app: blue-green-api
        version: green
    spec:
      containers:
        - name: api
          image: deployshift-api:v2.0.0
          imagePullPolicy: Never    # Use local Docker image (Docker Desktop K8s)
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: APP_ENV
              value: "green"
          envFrom:
            - configMapRef:
                name: blue-green-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 15
